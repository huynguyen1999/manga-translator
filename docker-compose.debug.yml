services:
  backend:
    command: ["--host=0.0.0.0", "--port=8000", "--start-instance", "--no-gpu", "--workers=1"]

  front:
    environment:
      NODE_ENV: development
      NODE_OPTIONS: --inspect=0.0.0.0:9229
    ports:
      - 6868:6868
      - "127.0.0.1:9229:9229"
    command: ["npm", "start"]
